server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # platform is built with base "/platform/" (see deploy.yaml), so its assets live under
    # /usr/share/nginx/html/platform and must be served at that same prefix.
    location /platform/ {
        try_files $uri $uri/ /platform/index.html;
    }

    location = / {
        return 302 /platform/;
    }
}
