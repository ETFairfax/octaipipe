# Checks run on every PR and every push to main. On main only, the same workflow then
# builds one image per app, pushes it to GHCR tagged with the commit SHA.
#
# The three jobs live in one workflow because `needs:` cannot span workflow files, and images
# must never be pushed for a commit whose checks failed.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer main push supersedes an in-flight one: two concurrent runs would race to push the
# same :latest tag, and the loser could overwrite it with an older image after the winner finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome lint and format check
        run: pnpm check:ci
      - name: Package boundaries
        run: pnpm boundaries
      - name: Import rules (cycles, internals)
        run: pnpm lint:imports
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  affected:
    name: Determine affected apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --affected needs the full commit graph between base and head, or it treats
          # every package as affected. `filter: blob:none` keeps this a partial clone (skips
          # file contents) rather than a truly full one, per turbo's own recommendation:
          # https://turborepo.dev/docs/reference/run#--affected
          fetch-depth: 0
          filter: blob:none

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On GitHub Actions turbo picks its own diff base for --affected. 
      # On a push that is the event's "before" SHA (with a fallback for new/force-pushed branches), so nothing to do.
      # On a pull_request it is the bare base branch name, which doesn't exist locally in a detached PR checkout (only origin/<name> does)
      # — turbo then just warns and treats every package as affected — so pin TURBO_SCM_BASE to the base SHA. 
      # On a push this expression is empty, which turbo treats as unset.
      - name: Determine affected apps
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # --filter restricts the query to apps/* itself, so a change to a shared packages/*
          # library (still picked up transitively via --affected) never surfaces the library
          # package itself as something to build an image for.
          apps=$(pnpm exec turbo run build --filter='./apps/*' --affected --dry=json \
            | jq -c '[.packages[]? | select(startswith("@workspace/")) | sub("^@workspace/"; "")]')

          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Affected apps: $apps"

  build-image:
    name: Build image (${{ matrix.app }})
    # Gated on `checks` (not just `affected`) so a broken lint/typecheck/test run blocks image
    # builds entirely, even though `affected` itself has no reason to wait on `checks`.
    needs: [checks, affected]
    if: needs.affected.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.affected.outputs.apps) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Compute lowercase image repository owner
        id: image-repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image tag metadata
        id: tag-meta
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Only a push to main publishes; a PR build just proves the image builds, matching
      # the rest of this repo's "PRs validate, main deploys" split.
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.image-repo.outputs.owner }}/octaipipe-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ steps.image-repo.outputs.owner }}/octaipipe-${{ matrix.app }}:latest
            ghcr.io/${{ steps.image-repo.outputs.owner }}/octaipipe-${{ matrix.app }}:${{ steps.tag-meta.outputs.date }}-${{ github.run_number }}-${{ steps.tag-meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
